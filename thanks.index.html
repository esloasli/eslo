<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ثبت‌نام موفق | آکادمی اسلو</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:20px;
 background:#071426;color:white;
 font-family:Vazirmatn,sans-serif;
}
.card{
 max-width:480px;width:100%;text-align:center;
 background:#10233d;border:1px solid #29466a;
 border-radius:25px;padding:45px 25px;
 box-shadow:0 20px 60px #0005;
}
.check{
 width:75px;height:75px;margin:auto auto 22px;
 border-radius:50%;display:grid;place-items:center;
 background:#123f55;color:#38bdf8;font-size:40px;
}
h1{font-size:27px;margin:10px 0}
h1 span{color:#60a5fa}
p{color:#b8c9df;line-height:2;font-size:14px}
a{
 display:block;margin-top:28px;padding:14px;
 background:linear-gradient(110deg,#2563eb,#38bdf8);
 border-radius:12px;color:white;text-decoration:none;
 font-weight:800;
}
small{display:block;margin-top:25px;color:#8296b1}
</style>
</head>
<body>
<div class="card">
 <div class="check">✓</div>
 <h1>ثبت‌نامت <span>موفق بود!</span></h1>
 <p>
 درخواستت با موفقیت ارسال شد.<br>
 اطلاعاتت توسط تیم آکادمی اسلو بررسی می‌شه.
 </p>
 <p>از اعتمادت به آکادمی اسلو ممنونیم.</p>
 <a href="../index.html">بازگشت به صفحه اصلی</a>
 <small>ESLO ACADEMY</small>
</div>
</body>
</html>
